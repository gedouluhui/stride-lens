name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build setuptools wheel
      - run: python -m pip install 'torch>=2.5,<2.6' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install .
      - run: python scripts/verify.py
      - run: python -m build --no-isolation
      - run: python -c "import glob,subprocess,sys; files=glob.glob('dist/*.tar.gz'); assert len(files)==1, files; sys.exit(subprocess.call([sys.executable,'scripts/check_sdist.py',files[0]]))"
      - run: python -m stridelens demo --out demo.html --json demo.json
      - if: runner.os == 'Linux'
        run: python -m pip install '.[browser]'
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: python scripts/check_browser.py
