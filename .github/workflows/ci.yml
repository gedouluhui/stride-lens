name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build setuptools wheel
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install .
      - run: python scripts/verify.py
      - run: python -m build --no-isolation
      - run: python -c "import glob,subprocess,sys; files=glob.glob('dist/*.tar.gz'); assert len(files)==1, files; sys.exit(subprocess.call([sys.executable,'scripts/check_sdist.py',files[0]]))"
      - run: python -m stridelens demo --out demo.html --json demo.json
      - if: runner.os == 'Linux'
        run: python -m pip install '.[browser]'
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: python scripts/check_browser.py
